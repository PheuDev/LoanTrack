services:
  - type: web
    name: loantrack-flexiloan
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --prefix server --production=false && npm ci --prefix client --production=false && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true